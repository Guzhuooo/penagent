name: Native compile (CI-only)

# Practical, non-device workflow for the native httpx core. Every C/C++
# configure, compile and test step runs inside GitHub Actions on a GitHub-hosted
# runner; nothing here is meant to run on a developer machine.
#
# Trust boundary: this is NOT the device-artifact workflow. It uses the runner's
# own host compilers/libraries for the host CTest job and only *compiles* (never
# links, never runs) AArch64 objects as a syntax/ABI smoke test. It produces no
# .so, no AMR and no device-compatibility claim. The reviewed device-artifact
# path stays in native-manual.yml and remains disabled (native/ci-policy.json
# "enabled": false) until an approved vendor toolchain/sysroot bundle exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-compile.yml
      - native/**
      - tools/**

permissions:
  contents: read

concurrency:
  group: native-compile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  js-tests:
    name: JS app tests (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Run JS tests (no dependency install required)
        run: |
          { echo "node: $(node --version)"; echo "npm: $(npm --version)"; } | tee js-tests.log
          npm --prefix app test 2>&1 | tee -a js-tests.log
      - name: Upload JS test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-tests-${{ github.sha }}
          path: js-tests.log
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

  native:
    name: Host CTest + AArch64 compile-only smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record runner image identity
        run: |
          mkdir -p ci-evidence build-cross
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "trigger: ${GITHUB_EVENT_NAME}"
          } > ci-evidence/runner-identity.txt
          uname -a | tee -a ci-evidence/runner-identity.txt
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release | tee -a ci-evidence/runner-identity.txt

      - name: Install runner host tools only (never a device toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libcurl4-openssl-dev python3 g++-aarch64-linux-gnu file
          {
            echo "cmake: $(cmake --version | head -1)"
            echo "ninja: $(ninja --version)"
            echo "host g++: $(g++ --version | head -1)"
            echo "host g++ triple: $(g++ -dumpmachine)"
            echo "aarch64 g++: $(aarch64-linux-gnu-g++ --version | head -1)"
            echo "aarch64 g++ triple: $(aarch64-linux-gnu-g++ -dumpmachine)"
            echo "python3: $(python3 --version 2>&1)"
            echo "curl-config: $(curl-config --version)"
            echo "pkg-config libcurl: $(pkg-config --modversion libcurl 2>/dev/null || echo unavailable)"
            echo "host curl header: $(find /usr/include -path '*/curl/curl.h' -print -quit)"
            dpkg-query -W -f='${Package} ${Version}\n' \
              libcurl4-openssl-dev libc6-dev-arm64-cross g++-aarch64-linux-gnu cmake 2>/dev/null || true
          } | tee ci-evidence/toolchain-versions.txt

      - name: Pure Python fail-closed policy contract tests (no C/C++)
        run: python3 -B -m unittest discover -s tools/tests -p 'test_native_ci.py' -v 2>&1 | tee ci-evidence/python-policy-tests.log

      - name: Host configure (plugin OFF, core tests ON)
        run: |
          cmake -S native -B build-host -G Ninja \
            -DHTTPX_BUILD_PLUGIN=OFF -DHTTPX_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ci-evidence/host-configure.log

      - name: Host build
        run: cmake --build build-host --parallel 2 2>&1 | tee ci-evidence/host-build.log

      - name: Host CTest (real loopback core tests)
        run: ctest --test-dir build-host --output-on-failure --timeout 60 2>&1 | tee ci-evidence/host-ctest.log

      - name: AArch64 compile-only smoke (no link, no device claim)
        run: |
          # Stage only the runner's curl headers; the AArch64 compiler keeps its
          # own target glibc/libstdc++ headers (host /usr/include is not added).
          host_curl_header="$(find /usr/include -path '*/curl/curl.h' -print -quit)"
          test -n "$host_curl_header"
          mkdir -p .ci-curl-include
          cp -r "$(dirname "$host_curl_header")" .ci-curl-include/curl
          aarch64-linux-gnu-g++ -std=gnu++17 -O2 -Wall -Wextra -fPIC \
            -I native/src -I .ci-curl-include \
            -c native/src/httpx_core.cpp -o build-cross/httpx_core.o 2>&1 | tee ci-evidence/aarch64-compile.log
          aarch64-linux-gnu-g++ -std=gnu++17 -O2 -Wall -Wextra \
            -I native/src \
            -c native/tests/httpx_core_tests.cpp -o build-cross/httpx_core_tests.o 2>&1 | tee -a ci-evidence/aarch64-compile.log

      - name: Verify AArch64 ELF objects (text evidence only)
        run: |
          {
            echo "# AArch64 compile-only smoke"
            echo "compiler: $(aarch64-linux-gnu-g++ --version | head -1)"
            echo "compiler triple: $(aarch64-linux-gnu-g++ -dumpmachine)"
            echo "note: objects were compiled from the same source as the host build,"
            echo "but they were never linked or executed; no target library was used."
            echo
          } > ci-evidence/aarch64-readelf.txt
          for object in build-cross/*.o; do
            aarch64-linux-gnu-readelf -h "$object" > "${object}.readelf-h.txt"
            aarch64-linux-gnu-nm --undefined-only "$object" > "${object}.undefined.txt"
            {
              echo "## ${object}"
              file "$object"
              grep -E 'Class:|Data:|OS/ABI:|Type:|Machine:' "${object}.readelf-h.txt"
              echo "undefined symbols of interest:"
              grep -E 'curl_|pthread_|socket|bind|listen' "${object}.undefined.txt" || true
              sha256sum "$object"
              echo
            } >> ci-evidence/aarch64-readelf.txt
            grep -q 'Machine:.*AArch64' "${object}.readelf-h.txt" \
              || { echo "not an AArch64 object: ${object}" >&2; exit 1; }
            grep -q 'Class:.*ELF64' "${object}.readelf-h.txt" \
              || { echo "not an ELF64 object: ${object}" >&2; exit 1; }
          done
          # The core object must reference curl through the same C ABI the plugin
          # branch links against; this is a compile-only sanity check.
          grep -q 'curl_easy_perform' build-cross/httpx_core.o.undefined.txt
          aarch64-linux-gnu-nm --defined-only build-cross/httpx_core_tests.o > build-cross/httpx_core_tests.defined.txt
          grep -q ' main$' build-cross/httpx_core_tests.defined.txt
          cat ci-evidence/aarch64-readelf.txt

      - name: Publish evidence summary
        if: success()
        run: |
          {
            echo "# Native compile workflow (host-only; NOT device evidence)"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- trigger: ${GITHUB_EVENT_NAME}"
            echo "- host build: HTTPX_BUILD_PLUGIN=OFF, HTTPX_BUILD_TESTS=ON, Release, runner g++"
            echo "- CTest: real loopback transport tests ran on the runner"
            echo "- AArch64: compile-only smoke with \`aarch64-linux-gnu-g++\`; objects verified as ELF64/AArch64; nothing was linked or executed"
            echo "- no .so, no AMR, no device-ABI/TLS claim from this run"
            echo
            echo "## Host CTest tail"
            echo '```'
            tail -n 12 ci-evidence/host-ctest.log
            echo '```'
            echo
            echo "## AArch64 object verification"
            echo '```'
            grep -E '^ *(Class:|Data:|OS/ABI:|Type:|Machine:|## )|^build-cross/.*ELF ' ci-evidence/aarch64-readelf.txt
            echo '```'
          } > ci-evidence/summary.md
          cat ci-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ci-evidence-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
